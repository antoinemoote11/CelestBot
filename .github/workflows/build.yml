
name: Build CelestBot Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CelestBot source
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "CelestBot_Source.zip" -File | Select-Object -First 1
          if (-not $zip) { Write-Error "CelestBot_Source.zip introuvable"; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath source -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        shell: pwsh
        run: |
          dotnet publish "source/CelestBot.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload CelestBot
        uses: actions/upload-artifact@v4
        with:
          name: CelestBot-Windows
          path: publish/
          
